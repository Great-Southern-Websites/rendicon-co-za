{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{=site.url}">
      <img class="logo-light" src="{=site.url('images/logo.webp')}" alt="Rendicon" width="816" height="220">
      <img class="logo-dark" src="{=site.url('images/logo-dark.webp')}" alt="Rendicon" width="816" height="220">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle"><span></span></label>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{=site.url}">Home</a></li>
        <li><a href="{=site.url('what-we-do')}">What We Do</a></li>
        <li><a href="{=site.url('contact')}">Contact Us</a></li>
        <li><a href="{=site.url('photos')}">Photos</a></li>
        <li><a class="nav-phone" href="tel:+27824406860">082 440 6860</a></li>
      </ul>
    </nav>
  </div>
</header>
